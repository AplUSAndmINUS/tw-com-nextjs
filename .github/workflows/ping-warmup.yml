name: Ping Warmup (PROD keep-alive)

# Calls the /api/ping HTTP endpoint every four hours as a PROD keep-alive.
# This replicates the timerTrigger that SWA does not support.
#
# The interval was every 15 minutes until #256. At four hours the Functions
# host may idle out between pings, so the first API call after a quiet spell
# can be a cold start. The ping still confirms PROD answers.
#
# GitHub runs scheduled workflows from the default branch (develop), so a
# change here takes effect when it merges into develop. Minute 23 keeps the
# run off the top of the hour, when GitHub's scheduler is busiest.
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch: # allow manual runs for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PROD API
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" "${{ secrets.PROD_PING_URL }}")
          echo "Ping response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Ping returned non-200 status: $STATUS"
          fi
